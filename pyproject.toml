[project]
name = "baize-orchestration"
version = "1.5.0"
description = "Baize (白泽) orchestration module — LangGraph-powered pipeline automation for cybersecurity operations"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Baize Contributors" },
]
keywords = ["ai", "cybersecurity", "llm", "agent", "security", "orchestration", "soar", "pipeline"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]

dependencies = [
  "baize-core>=1.8.0,<3.0.0",
  "langgraph>=0.2.0",
  "langgraph-checkpoint>=2.0.0",
  "pyyaml>=6.0",
]

[project.entry-points."baize.modules"]
orchestration = "baize.orchestration:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "src/baize.orchestration",
]

[tool.hatch.build.targets.sdist]
include = [
  "src/baize/orchestration",
  "templates",
  "README.md",
]
